name: Sync Unified JS

on:
  push:
    paths:
      - "config/**/*.ini"
      - "clash/config.yaml"
      - "scripts/gen_script.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-unified-js:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Regenerate unified script from ini
        run: node scripts/gen_script.js

      - name: Commit and push unified script updates
        run: |
          if git diff --quiet -- scripts/unified.js; then
            echo "No unified JS changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- scripts/unified.js
          git commit -m "chore(scripts): regenerate unified script [skip ci]"
          git push
