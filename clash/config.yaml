mixed-port: 7890
allow-lan: true
bind-address: '*'
mode: rule
external-controller: :9090
unified-delay: true  # 更换延迟计算方式，去除握手等额外延迟
tcp-concurrent: true # 启用 TCP 并发连接。这允许 Clash 同时建立多个 TCP

dns:
  enable: true # 开启 DNS 配置
  listen: 0.0.0.0:1053 # DNS 监听端口，便于客户端稳定识别 DNS 模式
  enhanced-mode: fake-ip # 使用 fake-ip 提升规则匹配效率
  fake-ip-range: 198.18.0.1/16 # fake-ip 网段
  use-hosts: true # 读取 hosts
  use-system-hosts: true # 读取系统 hosts
  ipv6: false # IPv6 解析开关；避免网络不支持 IPv6 时拖慢首连
  cache-algorithm: arc
  default-nameserver: # 基础 DNS，必须为 IP 形式
    - 223.5.5.5
    - 119.29.29.29
  nameserver: # 主用国内 DNS，保证当前网络下能稳定完成解析
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  proxy-server-nameserver: # 解析代理节点域名时使用，优先国内 DNS 保证起步可达
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
  fallback: # 主用 DNS 不可用时再使用海外 DNS
    - https://doh.dns.sb/dns-query
    - https://dns.cloudflare.com/dns-query
    - https://dns.twnic.tw/dns-query
    - tls://8.8.4.4:853
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
      - 0.0.0.0/32
  fake-ip-filter-mode: blacklist # 显式启用 fake-ip-filter 模式（黑名单语义）
  fake-ip-filter:
    - '*.lan'
    - '*.localhost'
    - '*.test'
    - '*.local'
    - '*.home.arpa'
    - geosite:private
    - geosite:category-ntp
    - 'stun.*.*'
    - 'stun.*.*.*'
    - 'WORKGROUP'